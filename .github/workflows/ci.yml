# Run by hand only, as the owner decided to spend Actions' minutes (Actions > CI > Run workflow, or `gh workflow run CI
# --ref main`; a pull request's branch the same way): the solution built (warnings are errors) and every test run on
# macOS (arm64), Windows and Linux, the gate's failing the run and the report lane's listed; the debug relay built for
# Android and iOS, and carried in each package as the release's; the macOS disk images made and checked; the Windows
# installer and the Linux archive built, installed, used and uninstalled; each system's portable build run as a portable
# copy (the packaging scripts' check); and on Linux, the solution restored from nothing and every package checked
# against THIRD_PARTY_NOTICES.md. Every restore is locked to the packages.lock.json files. Actions are pinned to a
# release's commit.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

# A run started again on the same commit replaces the one still going; each commit keeps its own.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Avalonia's build task sends usage data from every build unless this is in the environment.
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  # The solution built and every test run on macOS, Windows and Linux, each lane's in shards that run at once, then a
  # summary job per lane and system and the report lane's failed tests in one table.
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    with:
      report: true

  # The debug relay for Android and iOS devices, built as the release builds it, so a change to it that no longer
  # compiles for one of them is heard here.
  debug-relay:
    name: Debug relay
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: The Android workload
        run: dotnet workload install android

      - name: Build the relays
        run: tools/debug-relay.sh android apple

      - name: Upload the relays
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-relay
          path: artifacts/debug-relay/
          if-no-files-found: error
          retention-days: 1

  # Each disk image, made with no Developer ID here (the app signed ad hoc, nothing notarized) and mounted read-only and
  # checked before it is done.
  package:
    name: Disk image (${{ matrix.rid }})
    needs: debug-relay
    strategy:
      fail-fast: false
      # Apple Silicon's and Intel's, both on an Apple Silicon runner: the Intel app is cross-published and runs its check
      # under Rosetta.
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      # The whole history, since the build number counts the commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The Intel app's check runs it under Rosetta with an Intel SDK beside the runner's own, set up first so the
      # runner's own builds; tools/package-mac.sh takes it from DOTNET_ROOT_X64.
      - name: An Intel .NET SDK for the check
        if: matrix.rid == 'osx-x64'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-intel
        with:
          global-json-file: global.json
          architecture: x64
          skip-lts-prepass: true

      # Rosetta, which the runner may lack; setup-dotnet puts another processor's .NET in a folder beneath the one given.
      - name: Rosetta
        if: matrix.rid == 'osx-x64'
        run: |
          arch -x86_64 /usr/bin/true 2> /dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          for root in "$RUNNER_TEMP/dotnet-intel/x64" "$RUNNER_TEMP/dotnet-intel"; do
            [ ! -x "$root/dotnet" ] || break
          done
          arch -x86_64 "$root/dotnet" --version
          echo "DOTNET_ROOT_X64=$root" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The test shards' packages, when one has saved them; this job saves none of its own.
      - name: Restore cached NuGet packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      # The app carries the relays from artifacts/debug-relay under debugger/relay/<rid>/, as the release's does.
      - name: The debug relays
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-relay
          path: artifacts/debug-relay

      - name: Make and check the disk image
        run: tools/package-mac.sh ${{ matrix.rid }}

  # Check a per-user Windows installation and the native MCP surface before uninstalling it.
  installer:
    name: Windows installer (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The whole history: tools/package-win.sh names the version by the commit's tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # .NET 10 runs vpk and the test's project.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # The test shards' packages, when one has saved them; this job saves none of its own.
      - name: Restore cached NuGet packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the installer
        run: tools/package-win.sh win-x64

      # A person's state, which the uninstall must leave, is there before the install, as it is for one who reinstalls.
      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Join-Path $env:LOCALAPPDATA 'Pitstop'
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          Set-Content -Path (Join-Path $state 'kept-by-uninstall.txt') -Value 'a person''s state'
          $setup = Start-Process -FilePath artifacts/package/Pitstop-windows-x64.exe -ArgumentList '--silent' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup --silent exited $($setup.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'PitstopIDE'
          $exe = Join-Path $root 'current\Pitstop.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Pitstop.lnk'
          foreach ($path in $exe, (Join-Path $root 'Update.exe'), (Join-Path $root 'current\native-templates\xmake\cpp-console\template.json'), $shortcut) {
            if (-not (Test-Path $path)) { throw "The install has no $path" }
          }
          foreach ($payload in 'roslyn', 'roslyn-extension', 'debugger', 'host', 'inspector', 'testframes', 'updatehandlers', 'wpfpreview', 'mauipreview') {
            if (Test-Path (Join-Path $root "current\$payload")) { throw "The native install contains $payload" }
          }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PitstopIDE'
          if ($entry.DisplayName -ne 'Pitstop') { throw "Settings > Apps lists the install as '$($entry.DisplayName)'" }
          foreach ($extension in '.c', '.h', '.cpp', '.cc', '.cxx', '.hpp', '.hh', '.hxx', '.cppm', '.ixx', '.mpp', '.cxxm', '.ccm', '.lua') {
            $command = (Get-Item "HKCU:\Software\Classes\Pitstop$extension\shell\open\command").GetValue('')
            if ($command -ne "`"$exe`" `"%1`"") { throw "Pitstop$extension opens with '$command', not Pitstop.exe" }
            if ((Get-Item "HKCU:\Software\Classes\$extension\OpenWithProgids").GetValueNames() -notcontains "Pitstop$extension") {
              throw "$extension does not list Pitstop among the programs that open it"
            }
          }
          "PITSTOP_EXECUTABLE=$exe" >> $env:GITHUB_ENV

      - name: Build the tests
        run: dotnet build tests/Passenger.Tests

      - name: Check native MCP and workspace trust on the installed application
        run: dotnet test tests/Passenger.Tests --no-build --filter "FullyQualifiedName~McpNativeProductTests" $(python -I tools/test-shards.py hang)

      # Update.exe removes the folder a few seconds after it exits; the person's state and Velopack's own logs
      # (%LocalAppData%\velopack) stay.
      - name: Uninstall
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'PitstopIDE'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PitstopIDE'
          $quiet = (Get-ItemProperty $key).QuietUninstallString
          if ($quiet -ne "`"$root\Update.exe`" --uninstall --silent") { throw "Settings > Apps uninstalls it silently with '$quiet'" }
          $uninstall = Start-Process -FilePath (Join-Path $root 'Update.exe') -ArgumentList '--uninstall', '--silent' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Update.exe --uninstall --silent exited $($uninstall.ExitCode)" }
          for ($i = 0; $i -lt 60 -and (Test-Path $root); $i++) { Start-Sleep -Seconds 1 }
          $left = @()
          if (Test-Path $root) { $left += "$root, with $(@(Get-ChildItem -Recurse -Force $root).Count) files" }
          if (Test-Path $key) { $left += 'its entry in Settings > Apps' }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Pitstop.lnk')) { $left += 'its Start menu entry' }
          foreach ($extension in '.c', '.h', '.cpp', '.cc', '.cxx', '.hpp', '.hh', '.hxx', '.cppm', '.ixx', '.mpp', '.cxxm', '.ccm', '.lua', '.sln', '.slnx', '.slnf', '.csproj') {
            if (Test-Path "HKCU:\Software\Classes\Pitstop$extension") { $left += "the Pitstop$extension file type" }
            $openWith = Get-Item "HKCU:\Software\Classes\$extension\OpenWithProgids" -ErrorAction SilentlyContinue
            if ($openWith -and $openWith.GetValueNames() -contains "Pitstop$extension") { $left += "Pitstop among the programs that open $extension" }
            $type = Get-Item "HKCU:\Software\Classes\$extension" -ErrorAction SilentlyContinue
            if ($type -and $type.GetValue('') -eq "Pitstop$extension") { $left += "Pitstop as what opens $extension" }
          }
          if ($left) { throw "The uninstall left $($left -join '; ')" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Pitstop\kept-by-uninstall.txt'))) { throw "The uninstall took the person's state" }

      # For trying a pull request's installer by hand; not a release.
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pitstop-windows-x64
          path: artifacts/package/Pitstop-windows-x64.exe
          retention-days: 7

  # The Linux archive installed by its install.sh (for one person, then for everyone), an agent debugging a project
  # through each install's Pitstop (read-only to the person in /opt), then uninstalled, with what each step must leave
  # checked: the desktop entry as desktops read it, and the file types it opens among them.
  archive:
    name: Linux archive (x64)
    needs: debug-relay
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      # The whole history: tools/package-linux.sh names the version by the commit's tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # .NET 10 for the test's project.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # The libraries a person installs (site/linux.html), and the desktop's own tools that read what install.sh adds.
      - name: The libraries Pitstop needs, and the desktop's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file git libx11-6 libice6 libsm6 libfontconfig1 \
            desktop-file-utils shared-mime-info

      # The test shards' packages, when one has saved them; this job saves none of its own.
      - name: Restore cached NuGet packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      # The app carries the relays from artifacts/debug-relay under debugger/relay/<rid>/, as the release's does.
      - name: The debug relays
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-relay
          path: artifacts/debug-relay

      - name: Make and check the archive
        run: tools/package-linux.sh linux-x64

      - name: Build the tests
        run: dotnet build tests/Passenger.Tests

      # A person's state, which the uninstall must leave, is there before the install, as it is for one who reinstalls.
      - name: Install for one person
        run: |
          state=$HOME/.local/share/Pitstop
          mkdir -p "$state"
          echo "a person's state" > "$state/kept-by-uninstall.txt"
          mkdir -p "$RUNNER_TEMP/download"
          tar -C "$RUNNER_TEMP/download" -xzf artifacts/package/Pitstop-linux-x64.tar.gz
          "$RUNNER_TEMP/download/pitstop/install.sh"
          opt=$HOME/.local/opt/pitstop
          for path in "$opt/pitstop" "$opt/app/Pitstop" "$opt/app/roslyn" "$opt/app/roslyn-extension" "$opt/app/debugger" \
            "$HOME/.local/share/icons/hicolor/256x256/apps/io.github.jancano.pitstop.png" \
            "$HOME/.local/share/icons/hicolor/scalable/apps/io.github.jancano.pitstop.svg"; do
            [ -e "$path" ] || { echo "::error::The install has no $path"; exit 1; }
          done
          [ "$(readlink -f "$HOME/.local/bin/pitstop-ide")" = "$opt/pitstop" ] || { echo "::error::~/.local/bin/pitstop-ide does not lead to the install"; exit 1; }
          entry=$HOME/.local/share/applications/io.github.jancano.pitstop.desktop
          desktop-file-validate "$entry"
          grep -qx "Exec=\"$opt/pitstop\" %f" "$entry" || { echo "::error::The menu entry does not start the install's launcher"; cat "$entry"; exit 1; }
          for type in sln slnx csproj; do
            grep -qx "[0-9]*:application/x-ms-$type:\*\.$type" "$HOME/.local/share/mime/globs2" \
              || { echo "::error::The shared MIME database does not know a .$type file as application/x-ms-$type"; exit 1; }
            grep -q "^application/x-ms-$type=.*io\.github\.zaneris\.pitstop\.desktop" "$HOME/.local/share/applications/mimeinfo.cache" \
              || { echo "::error::Pitstop is not among the programs that open .$type"; exit 1; }
          done

      - name: An agent debugs through the Pitstop installed for one person, whose helpers run on its own runtime
        run: |
          export PITSTOP_EXECUTABLE=$HOME/.local/bin/pitstop-ide
          dotnet test tests/Passenger.Tests --no-build --filter "FullyQualifiedName~McpDebuggingTests.An_agent_with_a_windowless_Passenger_finds_code_reads_its_warnings_and_debugs_it|FullyQualifiedName~McpDebuggingTests.Passengers_own_helpers_run_on_the_runtime_Passenger_runs_on" $(python3 -I tools/test-shards.py hang)

      - name: Uninstall for one person
        if: ${{ !cancelled() }}
        run: |
          "$HOME/.local/opt/pitstop/install.sh" --uninstall
          left=
          for path in "$HOME/.local/opt/pitstop" "$HOME/.local/bin/pitstop-ide" "$HOME/.local/bin/pitstop" \
            "$HOME/.local/share/applications/io.github.jancano.pitstop.desktop" \
            "$HOME/.local/share/icons/hicolor/256x256/apps/io.github.jancano.pitstop.png" \
            "$HOME/.local/share/icons/hicolor/scalable/apps/io.github.jancano.pitstop.svg" \
            "$HOME/.local/share/mime/packages/io.github.jancano.pitstop.xml"; do
            if [ -e "$path" ] || [ -L "$path" ]; then left="$left $path"; fi
          done
          [ -z "$left" ] || { echo "::error::The uninstall left$left"; exit 1; }
          [ -f "$HOME/.local/share/Pitstop/kept-by-uninstall.txt" ] || { echo "::error::The uninstall took the person's state"; exit 1; }

      - name: Install for everyone
        id: system
        run: |
          sudo "$RUNNER_TEMP/download/pitstop/install.sh" --system
          for path in /opt/pitstop/app/Pitstop /usr/local/bin/pitstop-ide /usr/share/applications/io.github.jancano.pitstop.desktop \
            /usr/share/icons/hicolor/256x256/apps/io.github.jancano.pitstop.png /usr/share/mime/packages/io.github.jancano.pitstop.xml; do
            [ -e "$path" ] || { echo "::error::The install for everyone has no $path"; exit 1; }
          done
          owned=$(find /opt/pitstop ! -user root | head -n 3)
          [ -z "$owned" ] || { echo "::error::The install for everyone has files not root's: $owned"; exit 1; }
          desktop-file-validate /usr/share/applications/io.github.jancano.pitstop.desktop

      - name: An agent debugs through the Pitstop installed for everyone, whose helpers run on its own runtime
        run: |
          export PITSTOP_EXECUTABLE=/usr/local/bin/pitstop-ide
          dotnet test tests/Passenger.Tests --no-build --filter "FullyQualifiedName~McpDebuggingTests.An_agent_with_a_windowless_Passenger_finds_code_reads_its_warnings_and_debugs_it|FullyQualifiedName~McpDebuggingTests.Passengers_own_helpers_run_on_the_runtime_Passenger_runs_on" $(python3 -I tools/test-shards.py hang)

      - name: Uninstall for everyone
        if: ${{ !cancelled() && steps.system.outcome != 'skipped' }}
        run: |
          sudo /opt/pitstop/install.sh --uninstall --system
          left=
          for path in /opt/pitstop /usr/local/bin/pitstop-ide /usr/local/bin/pitstop /usr/share/applications/io.github.jancano.pitstop.desktop \
            /usr/share/icons/hicolor/256x256/apps/io.github.jancano.pitstop.png \
            /usr/share/icons/hicolor/scalable/apps/io.github.jancano.pitstop.svg /usr/share/mime/packages/io.github.jancano.pitstop.xml; do
            if [ -e "$path" ] || [ -L "$path" ]; then left="$left $path"; fi
          done
          [ -z "$left" ] || { echo "::error::The uninstall for everyone left$left"; exit 1; }

      # For trying a pull request's archive by hand; not a release.
      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pitstop-linux-x64
          path: artifacts/package/Pitstop-linux-x64.tar.gz
          compression-level: 0
          retention-days: 7

  # The solution restored on Linux in locked mode with no package cache, so every package's signature is checked against
  # nuget.config's trusted signers (NuGet checks none on macOS); then every package must be named in the notices.
  packages:
    name: Packages (Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Pitstop.slnx --locked-mode

      - name: Every package in the notices
        run: python3 -I tools/check-notices.py
